environment_constraints:
  - >-
    NO hay base de datos corriendo. Las migraciones Prisma se escriben A MANO como SQL aditivo
    (mismo procedimiento del cycle-01, que produjo 2 migraciones así), se declara el cambio en
    apps/api/prisma/schema.prisma y se registra en sdd/schema.json con el nombre exacto del
    directorio de migración creado. Nunca correr `prisma migrate dev`.
  - >-
    NO hay credenciales Binance reales ni acceso a testnet. El criterio de aceptación de la spec
    dice "OCO colocada en testnet": se satisface con tests unitarios/de integración mockeados
    sobre el contrato del cliente REST (params enviados, firma, parsing de la respuesta, manejo
    de rechazo por lot-size/notional). El architect debe reescribir ese CA en términos
    ejecutables en CI y el reviewer validar contra la reinterpretación, no contra la letra
    (precedente del cycle-01: CA-001).
  - >-
    Todo cambio de comportamiento de trading va detrás de config con default conservador: un bot
    ya corriendo no puede cambiar de conducta por el solo hecho de desplegar este ciclo.

agent_contexts:
  functional:
    goal: >-
      Traducir venta inteligente y gestión activa de riesgo a historias de usuario verificables
      desde la perspectiva del dueño del bot: cortar una pérdida cuando el agente lo indica con
      alta convicción, no arriesgar más de lo que el análisis justifica, no quedar desprotegido
      entre ciclos ni ante una caída del proceso, asegurar ganancia parcial sin cerrar toda la
      posición, y no perder más de X por día en toda su cuenta. Definir criterios de aceptación
      MEDIBLES POR TEST DE SIMULACIÓN para cada una — la spec exige explícitamente que el
      criterio de aceptación sea demostrable con tests: corte de pérdida por señal, sizing
      modulado, OCO colocada, trailing/parciales ejecutando, límites agregados bloqueando
      sobre-exposición, y cada Trade nuevo referenciando su AgentDecision. Un CA que no pueda
      ejecutarse en CI sin BD ni credenciales debe reescribirse hasta que pueda.
    business_context: >-
      La plataforma opera bots de trading cripto con 6 agentes-personaje (KRYPTO, NEXUS, FORGE,
      SIGMA, CIPHER, AEGIS) que analizan el mercado vía LLM y deciden operar. Hoy el sistema
      paga el análisis completo y después lo ignora en la ejecución: compra siempre el mismo
      porcentaje fijo del balance sin importar qué dijeron FORGE ni AEGIS, no puede vender en
      pérdida aunque el agente lo pida con máxima confianza (solo sale por stop-loss fijo), deja
      las posiciones sin orden de protección en el exchange entre ciclos de 5 a 30 minutos, y no
      tiene ningún límite de riesgo que mire la cuenta completa del usuario en vez de un bot
      aislado. El objetivo de negocio es obtener ganancias de forma segura y con justificación
      de análisis previo: este ciclo es donde la justificación empieza a tener consecuencias
      sobre el dinero.
    relevant_spec_sections:
      - "1. Contexto y diagnóstico — hallazgo B (la inteligencia de venta/riesgo existe pero está desconectada de la ejecución)"
      - "3. Alcance por ciclo — Cycle-02, puntos 1 a 7 y su criterio de aceptación"
      - "5. Riesgos — feature-flag por config y default conservador; reglas de lot-size/notional en OCO spot"
    output_file: sdd/specs/spec-e-burgos-001-agents-simplification/cycles/cycle-02/functional.md

  planner:
    goal: >-
      Ordenar el ciclo con la secuencia de riesgo correcta, que acá es la inversa del cycle-01:
      primero el andamio de datos y contratos (migración de TradingConfig + FK Trade.decisionId,
      órdenes nativas en BinanceRestClient con sus tests, campo tipado del verdict de AEGIS),
      DESPUÉS el cableado que cambia comportamiento (sizing modulado, política de SELL, SL/TP
      reales, trailing/parciales, límites agregados), cada uno detrás de su default conservador.
      Separar los 3 follow-ups del cycle-01 como tasks propias e independientes — no mezclarlos
      con el cableado de trading, para que un problema en uno no bloquee al otro. Criterio de
      done por task: `pnpm nx run-many -t test lint` verde y el test de simulación del CA que
      esa task habilita. Estimar horas y story points.
    note: "Recibe el output del Funcional y del Arquitecto — no necesita la spec completa"
    output_file: sdd/specs/spec-e-burgos-001-agents-simplification/cycles/cycle-02/planner.md

  architect:
    goal: >-
      Definir (1) la política de SELL que reemplaza al veto de minProfitPct: qué campos nuevos
      lleva TradingConfig, cómo se combinan confianza del agente, profitPct actual y
      riskRewardRatio de simulateTrade, y cuál es el default que preserva el comportamiento
      actual; (2) la fórmula exacta de sizing con maxTradePct como techo y la semántica del
      verdict REDUCE, incluyendo qué pasa si AEGIS y FORGE se contradicen; (3) el contrato de
      LIMIT/STOP_LOSS_LIMIT/OCO en BinanceRestClient — params, firma, validación de
      lot-size/minNotional/tick-size, y qué hacer cuando el exchange rechaza la orden de
      protección DESPUÉS de que la compra ya se ejecutó (caso crítico); (4) el algoritmo de
      reconciliación al inicio de ciclo y su idempotencia; (5) cómo se aplican los límites
      agregados (exposición por activo entre configs, pérdida diaria, drawdown que pausa
      agentes) invocando RiskBudgetService/PortfolioContextService, y en qué punto exacto del
      pipeline se evalúan; (6) el campo tipado que reemplaza al regex de isFalseConcentrationBlock
      y su regla estructurada; (7) el SQL aditivo escrito a mano de TODAS las migraciones del
      ciclo (TradingConfig, Trade.decisionId, y la decisión sobre las tablas huérfanas), con el
      nombre de directorio exacto que después va a sdd/schema.json; (8) la reescritura ejecutable
      del CA "OCO colocada en testnet" para un CI sin credenciales.
    existing_tables:
