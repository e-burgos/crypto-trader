# sdd/specs/spec-e-burgos-001-agents-simplification/cycles/cycle-02/brief.yaml
# Generado por: sdd-orchestrator
# Al: iniciar el ciclo

cycle: 2
module: trading-agents-core
phase: smart-sell-and-active-risk-management
date: 2026-08-17
app_context: sdd/context/apps/api/context_prompt.md

objective: |
  Que la inteligencia que el sistema ya paga en análisis determine efectivamente cuánto se
  compra, cuándo se vende y cuánto riesgo se acepta: cablear al camino real de ejecución el
  andamio de dominio que el cycle-01 dejó registrado sin inyectores (RiskBudgetService,
  PortfolioContextService, simulateTrade), reemplazar el veto absoluto de minProfitPct sobre
  el SELL por una política explícita, proteger las posiciones con órdenes nativas del exchange
  y vincular cada Trade con la AgentDecision que lo justificó.

scope:
  - >-
    SELL en pérdida por señal — eliminar el veto absoluto de minProfitPct
    (apps/api/src/trading/trading.processor.ts:879-890: `if (profitPct < minProfitPct) continue`)
    y reemplazarlo por una política explícita y configurable en TradingConfig: el SELL en
    pérdida se permite cuando la confianza del agente supera un umbral. minProfitPct deja de ser
    un veto y pasa a ser el piso del camino "toma de ganancia"; el corte de pérdida por señal es
    un camino distinto con su propio umbral. Default conservador en la migración: el
    comportamiento de un bot ya corriendo no puede cambiar sin que su config lo habilite
    (riesgo declarado en la spec §5).
  - >-
    Sizing inteligente cableado — hoy el tamaño de orden es
    `balance × maxTradePct` fijo (libs/trading-engine/src/lib/order-executor.ts,
    `calculateTradeQuantity`). Pasa a ser maxTradePct como TECHO, modulado por el
    `positionSizeMultiplier` de AEGIS (dto/decision-synthesis.dto.ts:16) y el `maxTradeSize` de
    FORGE (sub-agent.service.ts:73), hoy ambos solo visibles en analytics
    (analytics.service.ts:240-243). El techo nunca se supera: modular es reducir.
  - >-
    Verdict REDUCE de AEGIS — hoy sin ningún manejo (orchestrator.service.ts solo trata BLOCK).
    Implementarlo como reducción de tamaño de la orden, no como bloqueo, con semántica
    definida por el architect y verificable por test.
  - >-
    Regla estructurada en lugar del override por regex — reemplazar `isFalseConcentrationBlock`
    (orchestrator.service.ts:458-465, regex `/concentraci[oó]n|exposici[oó]n.../i` sobre el
    texto libre de `reason`) por un campo tipado en la respuesta del agente + una regla
    estructurada evaluable. Un BLOCK legítimo nunca debe anularse por cómo esté redactado el
    motivo, ni un falso positivo de concentración depender de que el LLM elija la palabra
    "concentración".
  - >-
    Protección nativa del exchange — implementar órdenes LIMIT, STOP_LOSS_LIMIT y OCO en
    libs/data-fetcher/src/lib/binance/binance-rest.client.ts (hoy solo MARKET) y colocar SL/TP
    como órdenes reales al abrir posición (spot). Incluye las reglas de lot-size / minNotional /
    tick-size de Binance spot y su manejo de error. Sin credenciales reales en este entorno:
    se valida con tests unitarios/mocks sobre el contrato del cliente (payload, firma, params,
    manejo de rechazo), no contra testnet real.
  - >-
    Reconciliación de estado al inicio de cada ciclo — antes de decidir, el ciclo consulta el
    estado real de las órdenes abiertas en el exchange y concilia con Position/Trade locales
    (SL/TP ejecutados fuera de ciclo, órdenes canceladas, fills parciales). Es lo que cierra la
    ventana de desprotección entre ciclos y ante caídas del proceso.
  - >-
    Herramientas de ganancia, configurables en TradingConfig con default conservador
    (apagadas o neutras): trailing stop, take-profit escalonado (venta parcial + mover el stop a
    breakeven) y salida por tiempo máximo de posición.
  - >-
    Riesgo agregado por usuario — exposición total por activo sumada entre todas las
    TradingConfig del usuario, pérdida diaria máxima y drawdown que pausa agentes
    automáticamente, aplicados en el camino real de ejecución usando RiskBudgetService y
    PortfolioContextService (apps/api/src/agents/domain/) y `simulateTrade`
    (libs/trading-engine/src/lib/risk/), YA rescatados y testeados en el cycle-01 y registrados
    en AppModule sin inyectores — andamio deliberado que este ciclo debe conectar.
  - >-
    Trazabilidad — FK `Trade.decisionId → AgentDecision` (hoy el modelo Trade no tiene relación
    con AgentDecision) para que cada orden ejecutada quede vinculada a su justificación. Nullable
    en la migración: las filas históricas no tienen decisión asociada y no se backfillean.
  - >-
    FOLLOW-UP cycle-01 — capturar P2002 en `EvaluationProcessor.evaluate`: el check-then-create
    sobre el UNIQUE (decisionId, horizonMinutes) puede fallar el job por colisión concurrente en
    vez de resolverse como no-op explícito (hoy converge solo por el reintento de Bull).
  - >-
    FOLLOW-UP cycle-01 — fusionar `ResolvedAgentConfig` y `ResolvedAgentClient` y eliminar el
    cast `as unknown as AgentId` del borde `resolveClient → resolveConfig`, migrando los 3
    consumidores con vocabulario viejo (agent-config.controller.ts,
    admin-agent-config.controller.ts, market.service.ts) a `ModelSlotId`. Aprovechar para quitar
    el JSDoc narrativo del archivo (regla de cero comentarios).
  - >-
    FOLLOW-UP cycle-01 — decidir el destino de las tablas huérfanas `agent_tool_invocations`
    (+ enum AgentToolName) y `agent_model_policies`, sin escritores tras la poda. Decisión
    explícita del architect (dropear con migración propia vs conservar con justificación
    escrita); lo que NO puede es quedar sin decidir por tercer ciclo consecutivo.

