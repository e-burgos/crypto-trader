cycle: 1
module: reactive-execution-loop
phase: event-driven-loop
date: 2026-08-29
app_context: sdd/context/apps/api/context_prompt.md

objective: |
  Que el agente sea dirigido por precio y no por temporizador: que despierte cuando el mercado
  hace algo material, que ejecute sus reflejos (stop duro, trailing, re-armado de protección,
  take-profit parcial) sin pagar una llamada de LLM, bajo caps de frecuencia que ningún LLM
  puede relajar, y declarando explícitamente cuándo el stream se degradó en lugar de leer el
  silencio como quietud del mercado.

scope:
  - Consumidor de mercado en vivo sobre BinanceWsClient, con ciclo de vida propio en apps/api,
    suscripción por símbolo compartida entre bots del mismo par y dueño único bajo N réplicas.
  - Disparo del ciclo de decisión por evento material (movimiento contra la referencia de la
    última decisión, quiebre de nivel, spike de volumen) O por el temporizador vigente, lo que
    llegue primero. El temporizador pasa a ser el piso, nunca se elimina.
  - Fast path determinístico evaluado por tick, que ejecuta un set ACOTADO Y ENUMERADO de
    acciones sin LLM: stop duro, salida por trailing, re-armado de protección nativa y
    take-profit parcial.
  - Caps duros de frecuencia fuera del alcance del LLM: máximo de acciones por hora, tiempo
    mínimo entre ejecuciones y límite de pérdida diaria que frena el bot. Se evalúan en el
    mismo punto para el camino reactivo y para el del LLM.
  - Detección de staleness del stream: heartbeat + edad del último tick por símbolo, con
    fallback declarado a temporizador + REST.
  - Todo el loop nace apagado: con el interruptor en off el comportamiento observable es
    idéntico al actual.

out_of_scope:
  - Órdenes condicionales de ENTRADA descansando en el exchange (LIMIT_MAKER colocable,
    OCO de entrada, trailingDelta) — van a cycle-02 de esta misma spec.
  - Futuros USDⓈ-M, fapi, SHORT, apalancamiento (spec-e-burgos-007).
  - Subcuenta por bot, IP allowlist, DataSourceCredentialResolver sobre el eje configId
    (spec-e-burgos-006).
  - Migración de TradingMode (libs/shared/src/types/enums.ts:13) — esta spec es SPOT puro.
  - Binance Agent OS — descartado con evidencia en la spec, no re-investigar.
  - UI de configuración de los campos nuevos (deuda de UI ya diferida por spec-001).

dependencies_required:
  - spec-e-burgos-001-agents-simplification (completed) — gate determinista, sell-policy,
    position-manager, protección nativa y harness de costo LLM.

