cycle: 1
module: user-data-stream-fills
phase: exchange-event-driven-fills
date: 2026-09-04
app_context: sdd/context/apps/api/context_prompt.md

objective: |
  Que el fill de una orden de entrada descansando (LIMIT_MAKER / OCO, tabla entry_orders) se
  detecte por evento del exchange — user data stream de Binance: listenKey + executionReport —
  en vez de por la sonda por tick, con reconciliacion idempotente compartida con la sonda,
  fallback explicito a la sonda cuando el stream no esta sano, y todo detras de un interruptor
  que se entrega apagado para que el comportamiento observable por default sea identico.

scope:
  - Ciclo de vida del listenKey por credencial y modo (POST crear, PUT keepalive antes de los 60 min, DELETE en shutdown), con base URL de testnet y de live separadas y el listenKey tratado como material sensible
  - Cliente de user data stream en libs/data-fetcher, sobre el patron ya probado de BinanceWsClient (autoReconnect + backoff), con renegociacion del listenKey cuando el exchange lo invalida
  - Consumidor en apps/api con ciclo de vida propio: una sola suscripcion viva por credencial aunque varios bots del mismo dueno esten activos
  - Correlacion del executionReport con la fila entry_orders RESTING por clientOrderId, con orderId / orderListId como respaldo
  - Reconciliacion del fill por el MISMO camino que ya usan la sonda y el barrido de arranque (Position + Trade + proteccion inicial + bot_actions con source EXCHANGE_TRIGGER), nunca por un camino paralelo
  - Idempotencia verificada: mismo fill por stream x2, por stream + sonda, y por sonda + barrido de arranque produce una sola Position, un solo Trade y una sola fila de bot_actions
  - Deteccion de staleness de la suscripcion (edad del ultimo evento / ultimo keepalive) y estado degradado observable, con la sonda por tick siguiendo como red de contencion
  - Interruptor que se entrega apagado (ver decision D1-1: por default NO es una columna de TradingConfig)
  - Verificacion contra Binance TESTNET local (crear/renovar/cerrar listenKey y recibir al menos un executionReport real), mas doble de transporte para la suite que corre en CI sin red

out_of_scope:
  - Cualquier cambio en la SPA, en EP-017 o en los seis eventos entry-order:* — el requisito es que NO cambien
  - Reconciliacion por stream de las ordenes de proteccion (prefijo prot-) y de las ventas
  - Invalidacion inmediata del cache de posiciones del fast path (deuda anotada por spec-005 cycle-02)
  - Fills simulados en SANDBOX: la capa es LIVE/TESTNET, igual que spec-005 cycle-02
  - Endpoints REST nuevos
  - Cualquier operacion contra Binance LIVE

dependencies_required:
  - spec-e-burgos-005-reactive-execution-loop (completed — entry_orders, entry-fill-watch, ReconciliationService, StreamHealthService)
  - spec-e-burgos-009-agent-advanced-config-ui (completed — consumidor de los eventos entry-order:* que este ciclo no debe romper)

