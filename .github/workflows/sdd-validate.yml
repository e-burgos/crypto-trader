name: SDD Validate

on:
  pull_request:
    paths:
      - 'sdd/**'
      - 'package.json'
      - '.github/workflows/sdd-validate.yml'
  push:
    branches: [main]
    paths:
      - 'sdd/**'
      - 'package.json'
      - '.github/workflows/sdd-validate.yml'

concurrency:
  group: sdd-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate SDD registries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate SDD registries
        run: pnpm sdd:validate
