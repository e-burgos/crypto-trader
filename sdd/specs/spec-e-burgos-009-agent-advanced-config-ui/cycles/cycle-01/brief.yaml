cycle: 1
module: agent-advanced-config-ui
phase: shared-wire-and-advanced-config
date: 2026-09-03
app_context: sdd/context/apps/web/context_prompt.md

objective: |
  Que el trader configure desde la SPA, en el alta y en la edición del agente, los 25 interruptores y
  parámetros que hoy sólo existen por API (protección, señal y tamaño, loop reactivo y entrada),
  agrupados y explicados, siempre apagados por defecto; y que el wire de configuración viva una sola
  vez en libs/shared para que el typecheck del monorepo vuelva a proteger a apps/web.

scope:
  - libs/shared publica el tipo completo del wire de TradingConfig (40 campos del DTO + campos de
    lectura) y los tipos de alta/edición; apps/web importa de ahí y elimina su interface local.
  - Stepper de alta (new-agent-stepper-modal.tsx) y modal de edición (edit-agent-modal.tsx) con
    cuatro secciones nuevas: Protección, Señal y tamaño, Loop reactivo, Entrada. Interruptores
    apagados en el alta; parámetros dependientes editables sólo con el interruptor encendido; rangos
    del DTO como validación del cliente.
  - Reglas de coherencia visibles: entryOrderMode deshabilitado con explicación en SANDBOX;
    entryTrailingDeltaBips sólo con OCO; el modo de operación global manda sobre mode.
  - Detalle del agente (agent-detail-modal.tsx) muestra las cuatro secciones.
  - Locales es/en completos, incluidas las claves entryOrderPlaced, entryOrderFilled y entryOrderMissing.
  - Tests Vitest de comportamiento sobre fixtures del wire real (CA-001..CA-004, CA-007) y specs E2E
    headless de las secciones nuevas.

out_of_scope:
  - La vista de entradas descansando sobre EP-017, el tiempo real por WebSocket y el enlace desde
    notificaciones: cycle-02.
  - Cualquier cambio en apps/api (endpoints, DTOs, comportamiento). Un campo ininteligible para la UI
    se registra como fix.
  - Cancelar entradas desde la UI (no hay endpoint). Nuevas primitivas en libs/ui salvo exigencia de
    la regla 3 de frontend-component-rules. Reordenar los pasos existentes del stepper.

dependencies_required:
  - spec-e-burgos-005-reactive-execution-loop (completed 2026-09-01) — campos reactiveLoopEnabled,
    maxActionsPerHour, minActionIntervalSec, entryOrderMode, entryOrderTtlMinutes, entryTrailingDeltaBips.
  - spec-e-burgos-001-agents-simplification (completed) — el resto de los interruptores.

agent_contexts:
  functional:
    goal: >
      Convertir el objetivo en historias de usuario y reglas verificables por sección (Protección,
      Señal y tamaño, Loop reactivo, Entrada) para el alta, la edición y el detalle. Definir qué ve el
      trader cuando un interruptor está apagado, qué parámetros se habilitan al encenderlo, cómo se
      explica cada uno en una línea, y las reglas de coherencia (SANDBOX vs LIVE/TESTNET, OCO vs
      LIMIT_MAKER). Todo criterio debe ser una PROPIEDAD verificable sobre un fixture del wire o sobre
      el payload emitido, nunca un valor de mercado.
    business_context: >
      El bot sabe proteger, seguir con trailing, tomar ganancia parcial, filtrar señales, operar por
      evento con caps y colocar entradas en el exchange, pero el trader no puede encender nada de eso
      desde la SPA: todo se hace por API a mano. La deuda se difirió en spec-001 y en spec-005. Hay un
      bot TESTNET LIMIT_MAKER corriendo en producción que el dashboard no puede mostrar ni editar.
      Riesgo central: preseleccionar un interruptor en true en el alta cambiaría el comportamiento de
      todos los bots nuevos; los interruptores nacen apagados por regla del repo.
    relevant_spec_sections:
      - "1. Contexto y diagnóstico — hallazgos A, B, D, E"
      - "3. Alcance por ciclo — Cycle-01"
      - "5. Restricciones de diseño"
      - "6. Criterios de aceptación CA-001 a CA-004 y CA-007"

  planner:
    goal: >
      Tasks ordenadas por dependencia: libs/shared (tipos del wire) -> apps/web hooks (importar el
      wire, eliminar la interface local) -> componentes de sección reutilizables en
      apps/web/src/components/config/ -> stepper -> edición -> detalle -> locales -> tests Vitest ->
      E2E headless. Cada task es una unidad que commitea al terminar, con usage.model_tier.
    output_file: sdd/specs/spec-e-burgos-009-agent-advanced-config-ui/cycles/cycle-01/planner.md

  architect:
