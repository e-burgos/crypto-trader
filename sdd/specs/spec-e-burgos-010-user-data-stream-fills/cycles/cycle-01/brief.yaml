constraints:
  - Nunca LIVE — solo credenciales de TESTNET del .env; no arrancar un bot LIVE, no colocar ordenes LIVE, no abrir un user data stream contra la base URL de produccion de Binance
  - CI no llega a Binance (HTTP 451): la suite no puede depender de red; la corrida TESTNET es local y su evidencia se registra en el ciclo
  - Todo interruptor de comportamiento de trading nace apagado y cierra el ciclo apagado
  - Un campo nuevo de TradingConfig va en CreateTradingConfigDto Y UpdateTradingConfigDto (forbidNonWhitelisted -> 400 si falta en uno)
  - libs/trading-engine nunca depende de libs/data-fetcher; el vocabulario comun vive en libs/shared
  - Sin comentarios narrativos en el codigo (regla ✍️ del dual-harness)
  - Prohibido testear sobre el texto fuente de un rango entre dos simbolos
  - El listenKey y las claves de API no van a logs, ni a la BD en claro, ni a payloads de WS hacia la SPA
  - Antes de cerrar cualquier unidad de trabajo: pnpm nx run-many -t typecheck lint test sobre los proyectos tocados, y pnpm sdd:validate en verde

