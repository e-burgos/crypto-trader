      Fijar el contrato: nombre y shape exactos de los tipos en libs/shared (y cómo apps/api los
      reutiliza sin cambiar su DTO), la estructura de componentes (una sección = un componente con
      lógica en apps/web/src/components/config/, presenters de libs/ui), el modelo de estado del
      formulario (qué se envía en el POST del alta con defaults apagados y qué en el PUT de edición:
      sólo lo cambiado), las reglas de habilitación, las claves i18n (convención
      seccion.componente.elemento) y el contrato de tests. Sin endpoints nuevos: EP-006 y EP-007.
    existing_tables: []
    existing_endpoints:
