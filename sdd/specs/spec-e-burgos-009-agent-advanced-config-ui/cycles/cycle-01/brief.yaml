  reviewer:
    goal: >
      Validar CA-001..CA-004 y CA-007 por ejecución (typecheck del monorepo, Vitest, E2E headless en
      CI), confirmar que el alta sin tocar la configuración avanzada emite el mismo POST que hoy, y
