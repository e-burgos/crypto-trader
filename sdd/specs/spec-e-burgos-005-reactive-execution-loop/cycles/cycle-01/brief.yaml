decisiones_criticas:
  - id: D1
    titulo: Dueño del stream y del fast path bajo N réplicas
    pregunta: >
      El repo ya convive con réplicas y lo tiene documentado dos veces (los repetibles de
      evaluación usan jobId fijo + removeRepeatable "para que N réplicas no multipliquen el
      sweep"; el caché de data sources es in-memory por proceso). Un consumidor de WS con
      suscripciones y ventanas de conteo en memoria es infraestructura CON ESTADO, que es
      justamente lo que este backend no tiene. Sin dueño explícito: N suscripciones por símbolo,
      N evaluaciones del fast path sobre la misma posición y N órdenes. Definir el mecanismo de
      dueño único (lock en Redis con TTL, o elección por símbolo, o lo que corresponda) y qué
      pasa cuando el dueño muere. CA-007 depende de esta decisión.
  - id: D2
    titulo: Cómo un evento adelanta el ciclo sin duplicarlo
    pregunta: >
      Es Bull clásico y el delayed job se encola SIN jobId. Adelantar el ciclo sin neutralizar el
      delayed pendiente produce dos ciclos concurrentes sobre la misma posición. Job.promote()
      está disponible y sin usar. Definir la secuencia exacta (localizar el delayed del configId,
      promover o remover-y-encolar, y con qué guarda de concurrencia), y por qué esa secuencia es
      idempotente si el evento llega dos veces o si el job ya está activo. Respetar la razón
      documentada por la que hoy se omite el jobId.
  - id: D3
    titulo: Dónde viven los caps y por qué no pueden ser eludidos
    pregunta: >
      Los caps deben estar FUERA del control del LLM y aplicarse por igual al camino reactivo y
      al del LLM. Decidir: dónde se evalúan (una sola puerta, como assertBuyAllowed es la única
      puerta del riesgo agregado), sobre qué estado se cuentan (no memoria de proceso — CA-007),
      si requieren tabla nueva o alcanza con AgentDecision/Trade y sus índices existentes, y a
      qué nivel se configuran (TradingConfig por bot vs UserRiskPolicy por usuario — hoy
      maxDailyLossUsd está a nivel usuario y solo frena BUY). Si hace falta migración de Prisma,
      justificarla explícitamente; toda columna nueva de comportamiento nace apagada y todo campo
      nuevo de TradingConfig debe declararse en Create Y Update DTO o el request responde 400.
  - id: D4
    titulo: Umbral de evento material y presupuesto de LLM
    pregunta: >
      Definir qué constituye un evento material y con qué umbrales por defecto, de modo que
      CA-003 se cumpla: el costo de LLM por bot/día NO debe superar la línea base. El umbral es
      el que decide si el loop ahorra o quema dinero. Reusar el harness de costo determinista
      que ya existe (apps/api/src/orchestrator/cost-harness/, 12 escenarios congelados corridos
      línea base vs optimizado con assert POR ESCENARIO) en lugar de crear uno nuevo. Ningún
      umbral lo elige el implementor: van con nombre y default en un archivo de umbrales, como
      DEFAULT_GATE_THRESHOLDS.
  - id: D5
    titulo: Semántica de degradación del stream
    pregunta: >
      Definir el contrato de staleness: qué es un stream sano, cuál es la edad máxima tolerada
      del último tick por símbolo, cómo se declara la degradación (evento WS al front,
      notificación, campo consultable) y qué hace el bot mientras dura. Regla dura: el silencio
      del stream NUNCA se interpreta como ausencia de movimiento (hallazgo F).

