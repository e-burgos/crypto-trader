      Escribir las historias de usuario y criterios de aceptacion de cycle-02 partiendo de las de
      cycle-01 (functional.md del ciclo anterior es el insumo principal): las HU no cambian de
      intencion, cambian de transporte. Donde HU-04 hablaba del ciclo de vida del listenKey, ahora
      habla del ciclo de vida de la sesion autenticada (logon, resubscripcion tras reconexion,
      cierre en el shutdown). Sumar las HU de los follow_ups absorbidos y una HU explicita para el
      caso de la credencial Ed25519 ausente. Cada criterio tiene que ser ejecutable contra dobles
      salvo el de la corrida TESTNET.
    business_context: |
      El valor del ciclo es que el mecanismo deje de estar inerte: hoy el sistema detecta los fills
      de entradas descansando por una sonda que corre por tick de mercado, y entre el fill real y
      la sonda hay una ventana en la que la posicion existe en Binance y no existe para el sistema,
      sin proteccion nativa. Cycle-01 construyo el detector por evento y Binance retiro el endpoint
      del que colgaba. Nada de lo observable cambia con el interruptor apagado.
