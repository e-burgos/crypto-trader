# Hechos verificados contra el código y la documentación de Binance el 2026-09-01.
# NO re-investigar: usar como punto de partida y corregir solo con evidencia contraria.
verified_facts:
  execution_surface:
    - "OrderExecutorPort (libs/trading-engine/src/lib/order-executor.ts:43-73) tiene 9 métodos y DOS
       implementaciones: SandboxOrderExecutor (:86) y LiveOrderExecutor (:326). Todo método nuevo
       va por duplicado."
    - "LiveOrderExecutor tipa su dependencia como objeto ESTRUCTURAL inline (order-executor.ts:327-370)
       y NO importa BinanceRestClient. trading-engine nunca depende de data-fetcher; el vocabulario
       compartido (ExchangeOrderState/ExchangeOrderStatus) vive en libs/shared/src/types/interfaces.ts:271."
    - "placeOcoSellOrder (binance-rest.client.ts:608-680) usa /api/v3/orderList/oco con side:'SELL'
       fijo, aboveType LIMIT_MAKER + belowType STOP_LOSS_LIMIT, newOrderRespType FULL, y valida
       LOT_SIZE/PRICE_FILTER/NOTIONAL en ambas piernas más PRICE_CROSSES_MARKET con referencePrice."
    - "trailingDelta: 0 ocurrencias en el repo. LIMIT_MAKER solo como aboveType interno del OCO."
    - "getSymbolFilters cachea LOT_SIZE, PRICE_FILTER y NOTIONAL/MIN_NOTIONAL. NO lee TRAILING_DELTA."
    - "ENDPOINT_WEIGHTS (binance-rest.client.ts:22-37) ya tiene POST /api/v3/order peso 1, POST
       /api/v3/orderList/oco peso 1, GET /api/v3/order 4, DELETE /api/v3/order 1, GET/DELETE
       /api/v3/orderList 4/1, /api/v3/openOrders 6 (siempre con símbolo)."
    - "Prefijo de clientOrderId de la protección: `prot-${position.id}-${attempt}`. El barrido de
       huérfanas (reconciliation.service.ts:320-346) SOLO toca órdenes cuyo clientOrderId empieza
       con 'prot-'. Una entrada con otro prefijo no se barre hoy: necesita su propio barrido."
  binance_docs:
    - "POST /api/v3/orderList/oco, side BUY: 'LIMIT_MAKER/TAKE_PROFIT_LIMIT price < Last Traded Price
       < stopPrice'. Para compra: belowType LIMIT_MAKER (belowPrice) y aboveType STOP_LOSS_LIMIT
       (aboveStopPrice + abovePrice + aboveTimeInForce)."
    - "trailingDelta: soportado en STOP_LOSS, STOP_LOSS_LIMIT, TAKE_PROFIT, TAKE_PROFIT_LIMIT; unidad
       BIPS (100 = 1 %); combinable con stopPrice (empieza a trackear cuando se cumple stopPrice; sin
       stopPrice trackea desde el próximo trade). BUY trackea desde el mínimo y dispara al subir el
       delta. Filtro de símbolo TRAILING_DELTA: para BUY STOP_LOSS/STOP_LOSS_LIMIT el valor debe
       estar entre minTrailingAboveDelta y maxTrailingAboveDelta. Las piernas de OCO también lo admiten."
  processor_buy_path:
    - "trading.processor.ts ~1027-1110: en LIVE/TESTNET construye LiveOrderExecutor(new
       BinanceRestClient({testnet: mode === TESTNET})), resuelve sizing, pasa assertBuyAllowed, y
       dentro de actionGate.authorizeAndRun({kind:'BUY', source:'LLM_CYCLE'}) hace placeMarketOrder,
       positionManager.openPosition, prisma.position.create (con protectionStatus PENDING si
       nativeProtectionEnabled) y prisma.trade.create. Ese `create` está tipado con `as any`: un
       campo inexistente pasa el typecheck y estalla en runtime."
    - "TESTNET usa cachedPrice (kline close) en vez de llamar al ticker de testnet: 'unreliable,
       aggressive rate limits'. El harness TESTNET debe tolerar latencia (~1 s por request medida)
       y usar precios lejos del mercado para que nada se llene."
    - "LLMDecision = {decision: BUY|SELL|HOLD, confidence, reasoning, suggestedWaitMinutes}. Sin precio.
       Niveles disponibles: IndicatorSnapshot.supportResistance {support[], resistance[]} (últimos 5,
       redondeados a 2 decimales en calculateSupportResistance, indicators.ts:235-266)."
  reconciliation:
    - "ReconciliationService.reconcile corre al inicio de cada ciclo del processor SOLO en LIVE/TESTNET
       con credenciales; hoy: reconcileProtected, closeFilledByExchange, attemptProtection,
       addExternalLiveOrderIds, sweepOrphanOrders. Un fill ocurrido con el servicio caído se detecta
       recién en el próximo ciclo."
  state_and_gates:
    - "bot_actions: kind BUY|SELL_FULL|SELL_PARTIAL|PROTECTION_REARM, source FAST_PATH|LLM_CYCLE,
       outcome EXECUTED|BLOCKED|DEFERRED|SUPERSEDED, blockedBy ACTIONS_PER_HOUR|MIN_INTERVAL|DAILY_LOSS.
       classifyActionExposure es la única fuente de la exposure; toda REDUCING sale allowed antes de
       mirar caps."
    - "ActionRequest = {userId, configId, symbol, mode, kind, source, positionId, decisionId,
       expected, detail}. authorizeAndRun toma lease rx:v1:bot:{configId}."
    - "TradingConfig ya tiene orderPriceOffsetPct (default 0), stopLimitOffsetPct (0.002),
       maxConcurrentPositions (2), nativeProtectionEnabled, reactiveLoopEnabled (false)."
    - "BinanceCredential tiene isTestnet con @@unique([userId, isTestnet]). users.service.ts resuelve
       las de testnet cuando mode === 'TESTNET'."
  environment:
    - "Credenciales de TESTNET disponibles en .env local (BINANCE_API_TESTNET_KEY/SECRET). El mismo
       .env tiene claves LIVE: el harness lee SOLO las de testnet y aborta si la URL base no es
