decisiones_criticas:
  - id: D1
    titulo: Dónde viven los campos avanzados en el alta
    pregunta: >
      Un paso "Avanzado" nuevo antes de review (colapsado por sección) versus repartir las secciones en
      los pasos existentes (Protección en risk, Loop reactivo en timing, Entrada en risk o en un paso
      propio). Recomendación: un paso "Avanzado" opcional con las cuatro secciones colapsadas y todo
      apagado, para que el flujo básico no cambie (CA-002).
  - id: D2
    titulo: Cómo comparte apps/api el tipo del wire sin duplicar el DTO
    pregunta: >
      Definir el tipo en libs/shared y hacer que CreateTradingConfigDto lo implemente
      (implements) o derivarlo con satisfies, sin tocar los decoradores; o dejar el DTO como está y
      agregar un test de igualdad de claves. Elegir la opción que haga fallar el typecheck ante un
      campo nuevo en un solo lado.
  - id: D3
    titulo: Edición parcial
    pregunta: >
      El PUT actual envía el DTO completo o sólo lo cambiado. Verificar en edit-agent-modal.tsx y
      trading.service.ts (updateConfig hace spread del DTO). Definir el payload mínimo y cómo se
      prueba (CA-003).

