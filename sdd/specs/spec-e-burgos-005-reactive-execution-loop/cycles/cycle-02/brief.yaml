       TRAILING_DELTA min/max Above y Below = 10/2000 BIPS. Balances: 10000 USDT, 10000 USDC, 1 BTC.
       0 órdenes abiertas en BTCUSDT. Latencia: exchangeInfo ~950 ms, account ~300 ms."
    - "Producción se redeploya con cada push a main. El trabajo va en la rama feat/spec-005-cycle-02
       y se mergea después del cierre del reviewer, con el interruptor apagado."

decisiones_criticas:
  - id: D5
    titulo: Shape del contrato de entrada en el port
    pregunta: >
      Un solo método `placeEntryOrder(req)` con un discriminante de modo (LIMIT_MAKER | OCO_ENTRY),
      más `getEntryOrderStatus` y `cancelEntryOrder`, o un método por tipo. Definir los tipos en
      libs/shared (EntryOrderRequest / EntryOrderRef / EntryOrderResult / estado), cómo se
      representa un OCO de compra (orderListId + dos orderIds) frente a un LIMIT_MAKER suelto
      (orderId), y cómo el estado FILLED expone precio y cantidad ejecutados de la pierna que llenó.
      Mantener LiveOrderExecutor estructural.
  - id: D6
    titulo: Detección del fill y ventana sin protección
    pregunta: >
      Si la entrada se llena con el servicio ARRIBA, el bot tampoco se entera hasta el próximo
      ciclo del processor (15-30 min): la posición queda sin protección nativa durante esa
      ventana. Definir dónde se consulta el estado además de la reconciliación de inicio de ciclo:
      candidatos son (a) un chequeo en el riel reactivo cuando el tick toca el precio de la
      entrada (solo con reactiveLoopEnabled), (b) un job repetible barato por bot con entradas
      vivas, (c) ambos. Presupuestar el peso del endpoint. El user data stream queda fuera de alcance.
  - id: D7
    titulo: Tabla entry_orders y su ciclo de vida
    pregunta: >
      Columnas, índices, estados (RESTING | FILLED | CANCELLED | EXPIRED | MISSING) y transiciones.
      Quién vence una entrada (TTL desde placedAt), quién la cancela (decisión posterior HOLD/SELL,
      cap diario DISCARDED, stop del bot, fallo de protección tras el fill), y cómo se evita el
      doble conteo con bot_actions. Prefijo de clientOrderId propio y barrido de huérfanas
      propio. Sin FK a decision (auditoría), con FK a config/user como bot_actions.
  - id: D8
    titulo: Concurrencia y riesgo con entradas vivas
    pregunta: >
      maxConcurrentPositions y assertBuyAllowed hoy cuentan posiciones abiertas. Definir si una
      entrada RESTING cuenta como posición a efectos de concurrencia y de notional planificado
      (recomendación: sí, es exposición comprometida), y cómo se refleja en el sizing. Definir
      qué pasa si al reconciliar un fill la protección inicial falla (reusar
      closeOnProtectionFailure del camino existente).
  - id: D9
    titulo: Harness TESTNET como evidencia reproducible
    pregunta: >
      Diseñar el spec de Jest gateado por variable de entorno (por defecto se salta) que: lee solo
      BINANCE_API_TESTNET_*, fija testnet:true, aborta si la baseURL no es testnet, coloca cada
      tipo nuevo a precios lejanos del mercado (LIMIT_MAKER muy por debajo, STOP muy por encima),
      consulta, cancela, y termina afirmando cero órdenes abiertas propias. Tolerar la latencia y
      los rate limits de testnet. Dejar el comando documentado para que el reviewer lo corra.

harness_rules:
  - "Código sin comentarios: la documentación vive en los documentos SDD, no en el código."
  - "Prohibido testear sobre el texto fuente de un rango entre dos símbolos."
  - "Releer libs/shared/src/types/interfaces.ts antes de implementar un contrato que lea un tipo compartido."
  - "Al centralizar una regla en un servicio, enumerar TODOS sus lectores, no solo el camino caliente."
  - "Un campo nuevo de TradingConfig va en Create Y Update DTO o el request responde 400."
  - "Una columna nueva se declara en schema.prisma; el prisma.position.create está tipado any."
  - "Toda salida que cierre posición llama releaseProtectionIfNeeded antes de vender."
  - "Registrar usage (tokens_in/tokens_out/model_tier) al cerrar cada task."
  - "Nunca una orden en LIVE. Si parece necesario, detenerse y preguntar al dev."

