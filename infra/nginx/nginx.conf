# Reverse proxy de crypto-trader.
# Contrato: spec-e-burgos-008 cycle-02, Fase 5. Cubre CA-005 y el hallazgo F.
#
# Este archivo NO se copia de display-ads: aquella plataforma no tiene WebSocket,
# asi que la parte de Socket.io se escribio de cero (hallazgo F de la spec).
#
# El certificado es Let's Encrypt emitido en este mismo servidor, NO un Origin
# Certificate de Cloudflare: trader.estebanburgos.com.ar no pasa por el proxy de
# Cloudflare (DEC-DOM). Por eso 80 esta abierto a internet — lo necesita el
# desafio HTTP-01 de la renovacion.

upstream crypto_trader_api {
    server api:3000;
    keepalive 32;
}

# Mapea la cabecera Upgrade para el handshake de WebSocket. Sin este map, un
# proxy_set_header Connection "upgrade" fijo rompe las peticiones HTTP normales.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name trader.estebanburgos.com.ar;

    # El desafio HTTP-01 tiene que responder por 80 SIN redireccion, o la
    # renovacion automatica falla y el sitio deja de cargar a los 90 dias.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name trader.estebanburgos.com.ar;

    ssl_certificate     /etc/letsencrypt/live/trader.estebanburgos.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trader.estebanburgos.com.ar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Los agentes suben snapshots de indicadores y respuestas de LLM.
    client_max_body_size 10m;

    # ── WebSocket de Socket.io ────────────────────────────────────────────────
    # Va ANTES de `location /` porque nginx elige el prefijo mas largo: sin este
    # bloque el handshake entra por el location generico, que no propaga Upgrade,
    # y el cliente conecta y se cae en silencio — exactamente el hallazgo F.
    location /socket.io/ {
        proxy_pass http://crypto_trader_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una conexion de mercado en vivo puede pasar minutos sin trafico del
        # lado del cliente. Con los 60s por defecto, nginx la corta y el frontend
        # reconecta en bucle.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://crypto_trader_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
