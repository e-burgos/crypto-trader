      - EP-007 PUT /trading/config/{id} (implemented, updated in spec-005 cycle-02)
      - EP-017 GET /trading/entry-orders (implemented; consumido en cycle-02 de esta spec)
    output_file: sdd/specs/spec-e-burgos-009-agent-advanced-config-ui/cycles/cycle-01/architect.md

  implementor_front:
    goal: >
      Implementar task por task contra el contrato del architect, con la skill frontend-component-rules
      (catálogo de libs/ui primero). Sin comentarios narrativos. Tests de comportamiento sobre
      fixtures del wire. Nunca abrir un browser visible: Vitest y Playwright headless.
    app: apps/web
    app_context: sdd/context/apps/web/context_prompt.md
    libs:
