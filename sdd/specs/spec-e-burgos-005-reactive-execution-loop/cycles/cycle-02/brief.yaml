  - spec-e-burgos-001-agents-simplification (completed) — protección nativa OCO, reconciliación, sell-policy.

agent_contexts:
  functional:
    goal: >
      Convertir el ítem 6 de la spec §3 y sus decisiones D2-1..D2-4 en historias de usuario y
      reglas de negocio verificables. Definir con precisión: qué modos de entrada existen, cuándo
      se coloca cada uno, cuándo vence o se cancela una entrada (TTL, decisión posterior del LLM
      distinta de BUY, cap diario DISCARDED, bot detenido), qué pasa cuando se llena con el servicio
      caído, y cómo se ve todo eso en bot_actions y en las notificaciones. Todo criterio debe medir
      una PROPIEDAD verificable sin mercado real (payload, estado persistido, mock no invocado).
    business_context: >
      cycle-01 hizo que el bot despierte por precio y ejecute reflejos de SALIDA sin LLM. En la
      ENTRADA sigue inerte: compra a mercado cuando el LLM lo dice y nada más. Una orden de entrada
      descansando en Binance compra en el nivel aunque el servicio esté caído — y el servicio se
      reinicia en cada deploy. Riesgo central: una orden mal colocada queda viva en el exchange y
      dispara sola; no se deshace con un deploy. Por eso el ciclo nace apagado y se verifica en
      TESTNET antes de tocar una clave LIVE.
    relevant_spec_sections:
      - "3. Alcance por ciclo — Cycle-02, ítem 6 y 'Decisiones de alcance de cycle-02' (D2-1..D2-4)"
      - "5. Restricciones de diseño — incluida la nota de TESTNET"
      - "6. Criterios de aceptación CA-001, CA-004, CA-006, CA-007 (aplican también a este ciclo)"

