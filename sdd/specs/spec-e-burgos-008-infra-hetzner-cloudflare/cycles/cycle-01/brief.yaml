notes: |
  La Fase 1 se ejecuto el 2026-08-31 ANTES de abrir esta spec, porque no escribia nada en el repo
  (provisioning puro sobre el VPS). Sus scripts se versionan en este ciclo, que es lo que la vuelve
  reproducible. Estado verificado al abrir el ciclo:
    - CX23 #164138483, Ubuntu 26.04.1 LTS, 2 vCPU / 3.7 GiB / 38 GB, Helsinki (hel1)
    - Acceso solo por clave crypto-trader-hetzner-202608; PasswordAuthentication no
    - Usuario deploy (uid 1000, sudo NOPASSWD, grupo docker); root en prohibit-password
    - Docker 29.7.2 + Compose 5.5.0; docker run hello-world OK
    - Firewall Hetzner crypto-trader-prod (id 11552165) applied: TCP/22 solo desde la IP del dev
    - Swap 2 GiB (el servidor venia con swap 0 y 3.7 GiB de RAM), vm.swappiness=10
    - unattended-upgrades activo, NTP sincronizado en UTC
    - Latencia medida a api.binance.com: ~263 ms por request; drift de reloj -140 ms
  Es decir: CA-001 ya se cumple. La task que lo cubre es de versionado y verificacion, no de
  ejecucion.
