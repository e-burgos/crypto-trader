  - Gate determinista pre-LLM, caché por (asset, pair, timeframe), prompt caching de proveedor y max_tokens por tarea (cycle-03)
  - Registrar `llmCostUsd` real por ciclo en AgentDecision y costo/día por bot en analytics (cycle-03)
  - >-
    Abstracción de exchange y futuros — leverage, shorts, positionSide, ExchangeClient genérico,
    BinanceWsClient (spec-e-burgos-002). Este ciclo implementa órdenes nativas SOBRE el
    BinanceRestClient existente, sin generalizar la interfaz.
  - Chat con function calling real y RAG (spec-e-burgos-003)
  - >-
    Unificar las 2 enumeraciones de agentId restantes (intent-classification.dto.ts y
