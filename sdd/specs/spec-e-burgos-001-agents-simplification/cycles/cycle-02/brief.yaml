    goal: >-
      Validar el output del ciclo contra el criterio de aceptación de la spec, que acá es
      explícitamente de TESTS DE SIMULACIÓN: que exista y pase un test por cada uno de corte de
      pérdida por señal, sizing modulado (techo respetado + modulación aplicada), colocación de
