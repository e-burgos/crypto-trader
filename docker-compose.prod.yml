# Compose de producción del VPS Hetzner (/opt/crypto-trader/docker-compose.yml).
# Contrato: spec-e-burgos-008 cycle-01, architect §1-2. Cubre US-01-003.
#
# nginx es el ÚNICO servicio que publica puertos. api, postgres y redis viven
# sólo en la red interna del compose.
#
# ⛔ NUNCA `docker compose down -v`: el flag -v borra los volúmenes con nombre y
#    se lleva la base entera.
services:
  # ── Postgres autoalojado ───────────────────────────────────────────────────
  # SIN `ports:` — architect DEC-03. NUNCA agregar `ports:`, ni siquiera
  # bindeado a 127.0.0.1 "para debuggear": para eso está
  # `docker compose exec postgres psql` desde el propio VPS por SSH.
  postgres:
    image: pgvector/pgvector:pg16 # la migración del RAG hace CREATE EXTENSION vector; postgres:16 pelado muere con P3018
    restart: unless-stopped
    env_file: .env.db # POSTGRES_PASSWORD y APP_DB_PASSWORD; lo escribe el deploy desde GitHub Secrets
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres # la base real la crea 00-init.sql con su owner correcto
      POSTGRES_INITDB_ARGS: '--data-checksums --auth-host=scram-sha-256'
    command: >
      postgres
      -c timezone=UTC
      -c log_timezone=UTC
      -c max_connections=60
      -c superuser_reserved_connections=3
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c maintenance_work_mem=128MB
      -c max_wal_size=1GB
      -c min_wal_size=128MB
      -c checkpoint_completion_target=0.9
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_worker_processes=2
      -c max_parallel_workers=2
      -c max_parallel_workers_per_gather=0
      -c idle_in_transaction_session_timeout=60000
      -c log_min_duration_statement=1000
      -c log_lock_waits=on
      -c log_line_prefix='%m [%p] %u@%d '
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    shm_size: '256mb'
    healthcheck:
      # Consulta la base REAL, no pg_isready: un pg_isready genérico da falso
      # verde durante initdb, cuando Postgres levanta un servidor temporal en
      # socket unix. architect DEC-04.
      test:
        [
          'CMD-SHELL',
          'PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -p 5432 -U "$$POSTGRES_USER" -d crypto_trader -c "SELECT 1" >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: # el disco son 40 GB y no se puede achicar; este contenedor loguea queries lentas
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # ── Redis — colas de Bull y leases del loop reactivo ───────────────────────
  # NO se copia el `--maxmemory-policy allkeys-lru` de display-ads. Allá Redis
  # es cache y desalojar una clave vieja es correcto; acá sostiene los ciclos de
  # agentes encolados y los leases rx:v1:* del loop reactivo, y un desalojo bajo
  # presión de memoria descarta jobs y leases EN SILENCIO. architect DEC-02.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --save 900 1
      --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # ── API NestJS ─────────────────────────────────────────────────────────────
  # SIN `ports:`: sólo nginx la alcanza, por la red interna.
  # El CMD de la imagen corre `prisma migrate deploy && prisma db seed` antes de
  # arrancar, así que las migraciones y el usuario ADMIN se aplican solos y NO
  # hay que duplicarlos en el workflow de deploy.
  api:
    image: crypto-trader-api:latest
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # Consulta el health check real (base + Redis), que responde 503 si alguna
      # está caída. Un `wget` a secas contra un endpoint que devuelve 200 fijo
      # no distinguiría un contenedor sano de uno sin base.
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # ── SPA (React + Vite) servida por su propio nginx ─────────────────────────
  # Va en el MISMO origen que la API a proposito: el nginx de borde publica la
  # SPA en / y la API en /api, de modo que no hay CORS, ni preflight, ni una
  # segunda configuracion de origenes que se desincronice. El WebSocket queda
  # same-origin por la misma razon.
  # SIN `ports:`: solo el nginx de borde la alcanza.
  web:
    image: crypto-trader-web:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # ── nginx — el único con puertos publicados ────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - web
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

volumes:
  postgres_data:
  redis_data:
