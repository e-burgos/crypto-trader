       placeMarketOrder, getBalance, getPrice, placeLimitOrder, placeStopLossLimitOrder,
       placeProtectionOrder, getProtectionOrderStatus, cancelProtectionOrder, getOpenOrders."
    - "LiveOrderExecutor (order-executor.ts:326-372) tipa su dependencia como objeto ESTRUCTURAL
       inline; no importa BinanceRestClient. Un ejecutor nuevo entra sin tocar trading.processor.ts.
       Aprovecharlo."
    - "NO existe LIMIT_MAKER colocable (solo como pierna interna del OCO, binance-rest.client.ts:666),
       NO existe trailingDelta en ninguna línea del repo, y placeOcoSellOrder tiene side:'SELL'
       hardcodeado (línea 664). Por eso la capa de órdenes de entrada es cycle-02."
  scheduling:
    - "Es Bull CLÁSICO (bull 4.16.5 + @nestjs/bull 11), NO BullMQ. Queue 'trading-agent'."
    - "El re-encolado (trading.processor.ts:566-586) es un job con delay que OMITE jobId a
       propósito: reutilizarlo mientras el job activo corre haría que Bull devuelva el job
       existente en vez de crear el delayed, deteniendo el agente en silencio."
    - "Job.promote() existe en Bull y el repo NO lo usa en ningún lado. Operaciones de Bull
       usadas hoy: add, getJob, getWaiting, getDelayed, getActive, remove."
    - "decision-gate.service.ts:163 ya fija waitMinutes = config.minIntervalMinutes cuando el gate
       resuelve sin LLM, con test que lo consagra: 'the gate never lengthens the cadence'.
       Acortar la cadencia desde el código ya es patrón aceptado."
  reactive_rail:
    - "BinanceWsClient (libs/data-fetcher/src/lib/binance/binance-ws.client.ts, 166 líneas) tiene
       subscribeTicker, subscribeKline, connect, disconnect; eventos connected/ticker/kline/
       disconnected/reconnecting/error; autoReconnect default true, reconnectDelay 5000ms.
       Exportado en el barrel. 7 tests en binance-ws.client.spec.ts."
    - "Su ÚNICO importador en todo el repo es su propio spec. Cero consumo en producción."
    - "El precio hoy sale por REST: getKlines('1h', 200) para el ciclo, y getTickerPrice /
       executor.getPrice en los caminos de ejecución."
  deterministic_layer:
