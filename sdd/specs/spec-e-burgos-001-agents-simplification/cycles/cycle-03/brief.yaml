      Implementar el gate determinista, el caché compartido, el prompt caching y max_tokens por
      tarea, la escritura de llmCostUsd por ciclo y el endpoint de costo/día por bot; más los
      follow-ups backend: re-arme de la OCO al mover el stop, extensión del select de getPositions
      (EP-008), guard estático CA-031/CA-034 en el pipeline y reescritura de las dos aserciones de
      string-matching sobre checkOpenPositions.
    apps:
      - apps/api
      - libs/analysis
      - libs/openrouter
      - libs/trading-engine
      - libs/shared
    app_context:
      - sdd/context/apps/api/context_prompt.md
      - sdd/context/apps/api/constitution.md
      - sdd/context/libs/analysis/context_prompt.md
      - sdd/context/libs/openrouter/context_prompt.md
      - sdd/context/libs/trading-engine/context_prompt.md
      - sdd/context/libs/shared/context_prompt.md
    note: 'Recibe una task a la vez del Planner. Los contextos de subproyecto están consolidados a cycle-02: no hay fragmentos pendientes en updates/'

  implementor_front:
    goal: |
      PRIORIDAD 1 — migrar apps/web al wire nuevo de agentes (agentId → slot, union completo de
      ResolutionSource) en hooks/use-agent-config.ts y pages/dashboard/settings/agents.tsx,
      cubriendo con tests el desalineamiento que el typecheck no detecta porque el front declara su
      propia interfaz del response. Después: panel de costo/día por bot en la página de analytics,
      consumiendo el endpoint nuevo.
    app: apps/web
    app_context:
      - sdd/context/apps/web/context_prompt.md
      - sdd/context/apps/web/constitution.md
    note: |
      Recibe una task a la vez del Planner. El panel de costo depende de la task backend que
      implementa el endpoint; la migración del wire de agentes NO depende de nada y va primero.
      Convenciones no negociables de apps/web: todo dato del servidor por TanStack Query, todo
      texto por t('clave') en es.ts y en.ts, componentes stateless desde @crypto-trader/ui,
      Tailwind para estilos. La UI de configuración de los 17 campos de TradingConfig está
      explícitamente fuera de alcance.

  reviewer:
    goal: |
      Validar todo el output del ciclo y cerrar la spec. Además del checklist habitual: verificar
      que el ahorro de costo esté demostrado por el harness determinista y no por estimación, que
      ningún escenario con señal quede silenciado por el gate, que el deploy-blocker de apps/web
