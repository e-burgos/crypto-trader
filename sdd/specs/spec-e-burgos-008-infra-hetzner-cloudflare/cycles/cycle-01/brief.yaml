cycle: 1
module: infra-hetzner-cloudflare
phase: server-data-and-safety-net
date: 2026-08-31
app_context: sdd/context/apps/api/context_prompt.md

objective: |
  Dejar el VPS de Hetzner con Postgres (pgvector) y Redis corriendo en red interna sin puerto
  publico, con las migraciones aplicadas y con una cadena de backup a Cloudflare R2 cuyo restore
  fue verificado en una base descartable — de modo que la Fase 4 (migrar los datos de produccion,
  el paso irreversible) tenga una red debajo.

scope:
  - Fase 1 — Servidor en pie: CX23, firewall de Hetzner, usuario no-root con clave dedicada, Docker
  - Fase 1 — Provisioning versionado como scripts idempotentes (no pasos ejecutados a mano)
  - Fase 2 — pgvector/pgvector:pg16 y Redis con persistencia en red interna, sin puertos publicados
  - Fase 2 — Las 37 migraciones con prisma migrate deploy, incluida CREATE EXTENSION vector
  - Fase 3 — Port de db-backup.sh y db-restore.sh con sus suites de shell, incluida la guarda H-9
  - Fase 3 — Bucket privado en R2, reglas de lifecycle, cron de backup
  - Fase 3 — Restore verificado en una base descartable
  - Decision de RPO (spec §7 punto 1), porque condiciona el diseno de los backups

out_of_scope:
  - Migrar los datos de produccion desde Railway (Fase 4, cycle-02)
  - Levantar la API y nginx (Fase 5, cycle-02)
  - Frontend en Cloudflare Pages y corte de DNS (Fases 6-7, cycle-03)
  - Observabilidad y Resend (Fase 8 y spec aparte)
  - Arreglar el health check (hallazgo D): pertenece a la Fase 5

dependencies_required:
  - Ninguna spec previa. La spec declara depends_on vacio.

open_decisions_blocking:
  - Cuenta de Cloudflare a usar (spec §7 punto 2) — bloquea la Fase 3 completa
  - RPO (spec §7 punto 1) — bloquea el diseno del cron y las reglas de lifecycle

