date: 2026-09-01
app_context: sdd/context/apps/api/context_prompt.md

objective: |
  Que la reacción de ENTRADA también descanse en Binance: LIMIT_MAKER en nivel, OCO de entrada y
  trailingDelta colocables desde el bot, con su fill reconciliado a Position + protección aunque
  el servicio esté caído o reiniciando, contabilizado en bot_actions, bajo los caps existentes, y
  todo detrás de un interruptor que nace apagado y se cierra apagado.

scope:
  - Extender BinanceRestClient con las órdenes de entrada nuevas: LIMIT_MAKER colocable, OCO de
    compra por /api/v3/orderList/oco (LIMIT_MAKER abajo + STOP_LOSS_LIMIT arriba) y trailingDelta
    en BIPS sobre la pierna contingente; filtro TRAILING_DELTA en getSymbolFilters; pesos reales
    en ENDPOINT_WEIGHTS; validación LOT_SIZE/PRICE_FILTER/NOTIONAL/TRAILING_DELTA antes de firmar.
  - Extender OrderExecutorPort con el vocabulario de entrada (tipos en libs/shared) y las DOS
    implementaciones: LiveOrderExecutor (estructural, sin importar data-fetcher) y
    SandboxOrderExecutor (contrato en memoria para tests del port).
  - Persistir las entradas descansando (tabla entry_orders) y extender ReconciliationService:
    fill => Position + Trade + protección inicial; vencida/cancelada/huérfana => cierre y cancelación.
  - Camino de BUY del processor: cuando entryOrderMode != MARKET y el modo es LIVE/TESTNET,
    colocar la entrada descansando vía authorizeAndRun en lugar de la compra a mercado.
  - Contabilidad en bot_actions según D2-3 de la spec (colocación autorizada como BUY; fill
    auditado con source EXCHANGE_TRIGGER) y cancelación de entradas cuando el cap diario DISCARDA.
  - Interruptor entryOrderMode (default MARKET) + TTL + trailingDelta opcional en TradingConfig,
    declarados en Create y Update DTO.
  - Verificación en dos niveles: mock de transporte (payload exacto, firma, mock NO invocado ante
    rechazo local) y harness contra Binance TESTNET que coloca, consulta y cancela cada tipo nuevo.

out_of_scope:
  - Cualquier orden en LIVE durante el ciclo. Ni una.
  - Simulación persistente de fills en SANDBOX (D2-4 de la spec): SANDBOX sigue comprando a mercado.
  - Pedirle un precio de entrada al LLM o cambiar el formato de salida de la síntesis.
  - User data stream de Binance (executionReport por WS) para detectar fills: se difiere; el fill se
    detecta por consulta REST (ver decisión D6 abajo).
  - UI de configuración de los campos nuevos (deuda de UI ya diferida por spec-001).
  - La cola trading-agent duplicada entre TradingModule y ReactiveModule (deuda registrada, no bloqueante).
  - Futuros, SHORT, apalancamiento, subcuentas, IP allowlist (specs 006/007).

dependencies_required:
